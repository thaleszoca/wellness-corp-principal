<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness — Início</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/pages/home.css">
    <link rel="stylesheet" href="../../css/components/bottom-nav.css">
    <link rel="stylesheet" href="../../css/components/theme-toggle.css">
    <script src="../../js/utils/theme-toggle.js"></script>
</head>
<body>

<!-- Blobs decorativos (fundo do glass) -->
<div class="hm-bg" aria-hidden="true">
    <span class="hm-blob hm-blob--1"></span>
    <span class="hm-blob hm-blob--2"></span>
    <span class="hm-blob hm-blob--3"></span>
</div>

<!-- Header -->
<header class="hm-header">
    <div class="hm-brand">
        <img src="../../../assets/images/logo-wellness.png" alt="Wellness" class="hm-logo-img">
        <span class="hm-brand-name">Wellness</span>
    </div>
    <button class="hm-icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <span class="tt-icon">
            <svg class="tt-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="tt-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </span>
    </button>
</header>

<!-- Conteúdo -->
<main class="hm-main">

    <div class="hm-welcome">
        <p class="hm-greeting" id="hmGreeting">Olá</p>
        <p class="hm-quote" id="hmQuote"></p>
    </div>

    <!-- Card principal (glass) → abre o plano do dia -->
    <button class="hm-hero" id="hmCore" type="button" aria-label="Abrir plano do dia">
        <span class="hm-hero-glow" aria-hidden="true"></span>
        <img src="../../../assets/images/logo-wellness.png" alt="" class="hm-hero-logo" aria-hidden="true">
        <span class="hm-hero-tag">Seu dia</span>
        <span class="hm-hero-title">Plano de Hoje</span>
        <span class="hm-hero-sub" id="hmCoreSub">Ver minhas dietas</span>
        <span class="hm-hero-cta">
            Abrir
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
    </button>

</main>

<!-- ══════════════ NAV INFERIOR (fixa, estilo app) ══════════════ -->
<nav class="wn-nav" aria-label="Navegação principal">
    <div class="wn-nav-inner">
        <button class="wn-nav-item is-active" data-nav="inicio" type="button" aria-label="Início">
            <span class="wn-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            <span class="wn-nav-label">Início</span>
        </button>

        <button class="wn-nav-item" data-nav="progresso" type="button" aria-label="Progresso">
            <span class="wn-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
            <span class="wn-nav-label">Progresso</span>
        </button>

        <button class="wn-nav-item wn-nav-item--core" data-nav="plano" type="button" aria-label="Plano de Hoje">
            <span class="wn-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
            <span class="wn-nav-label">Plano</span>
        </button>

        <button class="wn-nav-item" data-nav="ayla" type="button" aria-label="Ayla">
            <span class="wn-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
            <span class="wn-nav-label">Ayla</span>
        </button>

        <button class="wn-nav-item" data-nav="perfil" type="button" aria-label="Perfil">
            <span class="wn-nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg></span>
            <span class="wn-nav-label">Perfil</span>
        </button>
    </div>
</nav>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<script src="../../js/pages/home.js"></script>
<script src="../../js/utils/bottom-nav.js"></script>
<script src="../../js/utils/cursor.js"></script>
</body>
</html>
