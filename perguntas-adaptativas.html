<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness — Questionário Comportamental</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="perguntas-adaptativas.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <script src="theme-toggle.js"></script>
</head>
<body>

<!-- Barra de progresso (fixed top) -->
<div class="pq-progress-bar">
    <div class="pq-progress-fill" id="progressFill"></div>
</div>

<!-- Header -->
<header class="pq-header">
    <div class="pa-header-goal">
        <span class="pa-header-fase" id="faseLabel">Perfil</span>
        <span class="pa-header-goal-name" id="goalName">—</span>
    </div>
    <div class="pq-step-counter">
        <span class="pq-step-num" id="stepNum">1</span>
        <span class="pq-step-sep"> de </span>
        <span id="stepTotal">5</span>
    </div>
</header>

<!-- ════ QUIZ ════ -->
<main class="pq-main active" id="quizMain">
    <div class="pa-card" id="questionCard"><!-- injetado via JS --></div>
</main>

<!-- ════ RESULTADO ════ -->
<main class="pa-result-main" id="resultMain"><!-- injetado via JS --></main>

<!-- Footer (setas voltar / avançar) -->
<footer class="pq-footer">
    <div class="pq-nav-arrows">
        <button class="pq-btn-back" id="backBtn" type="button" aria-label="Pergunta anterior">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        </button>
        <button class="pq-btn-next" id="continueBtn" type="button" aria-label="Próxima pergunta">
            <svg class="pq-btn-next-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
            <span class="pq-btn-next-spinner" aria-hidden="true"></span>
        </button>
    </div>
    <p class="pq-enter-hint">Pressione <kbd>Enter</kbd> para continuar</p>
</footer>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
    <span class="tt-icon">
        <svg class="tt-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="tt-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </span>
    <span class="tt-label">Claro</span>
</button>

<script src="dados.js"></script>
<script src="cursor.js"></script>
<script src="perguntas-adaptativas.js"></script>

</body>
</html>
